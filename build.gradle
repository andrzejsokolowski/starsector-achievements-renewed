plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java.srcDirs = ['src']

repositories {
    mavenCentral()
}

dependencies {
    // Starsector core (obfuscated game classes + bundled libs: lwjgl, json, log4j, ...)
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')
    // LunaLib supplies the settings page. Found wherever the mod happens to be installed.
    compileOnly fileTree(dir: "${starsectorPath}/mods", include: '**/LunaLib.jar')
    // MagicLib is optional. Only achievementsrenewed.compat.magiclib may name its classes, and that
    // package is loaded only when the mod MagicLib is enabled.
    compileOnly fileTree(dir: "${starsectorPath}/mods", include: '**/MagicLib.jar')
}

jar {
    destinationDirectory = file('jars')
    archiveFileName = 'AchievementsRenewed.jar'
}

def compiledClasses = { -> layout.buildDirectory.dir('classes/java/main').get().asFile }

// Starsector's classloader refuses java.io, java.nio.file and java.lang.reflect to mod code, and the
// refusal happens at class-resolution time - so a stray import surfaces as a crash somewhere else
// entirely. Catch it at build time instead by scanning every compiled class's constant pool.
tasks.register('checkNoForbiddenApis') {
    dependsOn tasks.named('classes')
    outputs.upToDateWhen { false }
    doLast {
        def forbidden = ['java/io/', 'java/nio/file/', 'java/lang/reflect/']
        def offenders = []
        fileTree(dir: compiledClasses(), include: '**/*.class').each { f ->
            def text = new String(f.bytes, 'ISO-8859-1')
            forbidden.each { needle ->
                if (text.contains(needle)) offenders << "${f.name} references ${needle}"
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden API used (Starsector will refuse to load it):\n  " +
                    offenders.join('\n  '))
        }
    }
}

// MagicLib is optional: only the compat package may name it, or the mod breaks without it.
tasks.register('checkMagicLibIsolated') {
    dependsOn tasks.named('classes')
    outputs.upToDateWhen { false }
    doLast {
        def offenders = []
        def root = compiledClasses()
        fileTree(dir: root, include: '**/*.class').each { f ->
            def path = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (path.startsWith('achievementsrenewed/compat/magiclib/')) return
            def text = new String(f.bytes, 'ISO-8859-1')
            if (text.contains('org/magiclib/') || text.contains('achievementsrenewed/compat/magiclib/')) offenders << path
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Only achievementsrenewed.compat.magiclib may refer to MagicLib:\n  " +
                    offenders.join('\n  '))
        }
    }
}

tasks.named('jar') { dependsOn tasks.named('checkNoForbiddenApis'), tasks.named('checkMagicLibIsolated') }

/** mod_info.json, the .version file and the Version Checker registration must agree. */
tasks.register('checkVersionMetadata') {
    doLast {
        def infoFile = file('mod_info.json')
        def versionFile = file('achievements_renewed.version')
        def registrationFile = file('data/config/version/version_files.csv')
        [infoFile, versionFile, registrationFile].each { metadata ->
            if (!metadata.isFile()) throw new GradleException("Missing update metadata: ${metadata.name}")
        }
        def parser = new groovy.json.JsonSlurper()
        def info = parser.parse(infoFile, 'UTF-8')
        def remote = parser.parse(versionFile, 'UTF-8')
        def parts = ['major', 'minor', 'patch'].collect { remote.modVersion?.get(it)?.toString() }
        if (parts.any { it == null || !(it ==~ /\d+/) } || info.version != parts.join('.'))
            throw new GradleException('mod_info.json and achievements_renewed.version must have the same numeric version')
        def masterUrl = 'https://raw.githubusercontent.com/andrzejsokolowski/starsector-achievements-renewed/main/achievements_renewed.version'
        def downloadUrl = 'https://github.com/andrzejsokolowski/starsector-achievements-renewed/releases/latest/download/AchievementsRenewed.zip'
        def changelogUrl = 'https://raw.githubusercontent.com/andrzejsokolowski/starsector-achievements-renewed/main/changelog.txt'
        if (info.id != 'achievements_renewed' || info.name != remote.modName)
            throw new GradleException('Update metadata must identify Achievements - Renewed')
        if (info.updateCheckURL != masterUrl || remote.masterVersionFile != masterUrl)
            throw new GradleException('Both update URLs must point to the published achievements_renewed.version file')
        if (remote.directDownloadURL != downloadUrl)
            throw new GradleException('The update download must point to the AchievementsRenewed.zip release asset')
        if (remote.changelogURL != changelogUrl)
            throw new GradleException('changelogURL must point to changelog.txt on main')
        if (info.modThreadId?.toString() != remote.modThreadId?.toString())
            throw new GradleException('mod_info.json and the .version file must name the same forum topic')
        if (info.gameVersion != remote.starsectorVersion)
            throw new GradleException('The supported Starsector versions do not match')
        if (registrationFile.readLines('UTF-8').findAll { !it.trim().isEmpty() } != ['version file', 'achievements_renewed.version'])
            throw new GradleException('Version Checker must register achievements_renewed.version')
        def changelog = file('changelog.txt').readLines('UTF-8')
        if (!changelog || !changelog[0].startsWith("Version ${info.version} "))
            throw new GradleException("changelog.txt must start with Version ${info.version}")
        logger.lifecycle("Update metadata verified for Achievements - Renewed ${info.version}")
    }
}

/**
 * Checks the files that ship: no UTF-8 BOM (it breaks every Starsector JSON and CSV), every art path
 * exists, LunaLib text has no %, and every row of the achievement list is well formed.
 */
tasks.register('checkReleaseFiles') {
    doLast {
        def problems = []
        fileTree(projectDir) {
            include 'mod_info.json', '*.version', 'data/**/*.json', 'data/**/*.csv'
        }.each { f ->
            def bytes = f.bytes
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF)
                problems << "UTF-8 BOM in ${projectDir.toPath().relativize(f.toPath())}"
        }

        def core = file("${starsectorPath}/starsector-core")
        def artRef = ~/graphics\/[A-Za-z0-9_\-\/. ]+?\.(png|jpg|webp)/
        fileTree(projectDir) { include 'data/**', 'src/**/*.java' }.each { f ->
            (f.getText('UTF-8') =~ artRef).each { match ->
                def path = match[0]
                if (!file(path).isFile() && !new File(core, path).isFile())
                    problems << "${projectDir.toPath().relativize(f.toPath())} names missing art ${path}"
            }
        }
        // LunaLib runs setting names and descriptions through String.format: a bare % crashes the
        // game the moment that settings tab opens. Write "percent" instead.
        file('data/config/LunaSettings.csv').readLines('UTF-8').eachWithIndex { line, i ->
            if (line.contains('%')) problems << "LunaSettings.csv line ${i + 1} contains % (crashes LunaLib): write \"percent\""
        }
        // The LunaLib icon must be packaged with the mod, not borrowed from the game.
        def luna = new groovy.json.JsonSlurper().parse(file('data/config/LunaSettingsConfig.json'))
        if (!luna.containsKey('achievements_renewed')) problems << 'LunaLib icon is not keyed by the mod id'
        luna.each { modId, config ->
            if (!file(config.iconPath).isFile()) problems << "LunaLib icon is not packaged: ${config.iconPath}"
        }

        // Every achievement row: columns, ids, goals, chains and script classes.
        def listFile = file('data/config/achievements_renewed/achievements.csv')
        def lines = listFile.readLines('UTF-8')
        def header = lines[0].split(',', -1) as List
        def columns = ['id', 'name', 'hint', 'howTo', 'description', 'icon', 'category', 'goal', 'secret', 'reward',
                       'chain', 'step', 'after', 'script', 'requiredMod', 'order', 'mod', 'tab']
        columns.each { if (!header.contains(it)) problems << "achievements.csv has no ${it} column" }
        def parseCsv = { String line ->
            def out = []; def cur = new StringBuilder(); boolean q = false
            for (int i = 0; i < line.length(); i++) {
                char c = line.charAt(i)
                if (q) {
                    if (c == '"' as char) { if (i + 1 < line.length() && line.charAt(i + 1) == '"' as char) { cur.append('"'); i++ } else q = false }
                    else cur.append(c)
                } else if (c == '"' as char) q = true
                else if (c == ',' as char) { out << cur.toString(); cur = new StringBuilder() }
                else cur.append(c)
            }
            out << cur.toString(); out
        }
        def builtIns = ['memory', 'player_memory', 'persistent', 'level', 'colonies', 'credits', 'wins', 'industry']
        def rows = [:]
        lines.drop(1).findAll { it.trim() && !it.startsWith('#') }.each { line ->
            def cells = parseCsv(line)
            if (cells.size() != header.size()) { problems << "achievements.csv row has ${cells.size()} cells, header has ${header.size()}: ${line.take(40)}"; return }
            def row = [header, cells].transpose().collectEntries { it }
            if (rows.containsKey(row.id)) problems << "achievements.csv ${row.id}: id used twice"
            rows[row.id] = row
            if (!row.name) problems << "achievements.csv ${row.id}: no name"
            if (!row.hint) problems << "achievements.csv ${row.id}: no hint"
            if (!row.howTo) problems << "achievements.csv ${row.id}: no howTo"
            if (row.goal && (!(row.goal ==~ /\d+/) || (row.goal as int) < 1)) problems << "achievements.csv ${row.id}: goal must be a whole number, 1 or more"
            if (row.step && !(row.step ==~ /\d+/)) problems << "achievements.csv ${row.id}: step must be a whole number"
            if (row.secret && !(row.secret.toLowerCase() in ['true', 'false'])) problems << "achievements.csv ${row.id}: secret must be true or false"
            if (row.script) {
                def word = row.script.split(':')[0]
                if (word.contains('.')) {
                    if (!file("src/${row.script.replace('.', '/')}.java").isFile()) problems << "achievements.csv ${row.id}: script class ${row.script} not found"
                } else if (!(word in builtIns)) {
                    problems << "achievements.csv ${row.id}: unknown built-in script ${row.script}"
                }
            }
            // This mod's own achievements are for the base game, so they all sit in the first tab.
            if (row.tab != 'vanilla') problems << "achievements.csv ${row.id}: tab must be vanilla"
        }
        rows.each { id, row ->
            if (row.after && !rows.containsKey(row.after)) problems << "achievements.csv ${id}: after names unknown achievement ${row.after}"
            if (row.after && !row.chain) problems << "achievements.csv ${id}: after needs a chain"
        }

        if (problems) throw new GradleException("Release files are not ready:\n  " + problems.join('\n  '))
        logger.lifecycle('Release files verified')
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkNoForbiddenApis'), tasks.named('checkMagicLibIsolated'),
            tasks.named('checkVersionMetadata'), tasks.named('checkReleaseFiles')
}

// Only what the game loads, plus the credits and the licence.
def releaseFiles = copySpec {
    from(projectDir) {
        include 'mod_info.json', 'achievements_renewed.version', 'CREDITS.txt', 'LICENSE'
        include 'data/**', 'graphics/**', 'jars/AchievementsRenewed.jar'
    }
}

// Sync, not Copy: files that no longer ship must not linger in the staging folder.
tasks.register('stageRelease', Sync) {
    dependsOn tasks.named('jar')
    with releaseFiles
    into layout.projectDirectory.dir('AchievementsRenewed')
}

// Package directly from the source files so stale staging contents cannot enter a release.
tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('stageRelease'), tasks.named('check')
    destinationDirectory = layout.projectDirectory
    archiveFileName = 'AchievementsRenewed.zip'
    into('AchievementsRenewed') { with releaseFiles }
}
